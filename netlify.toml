# ═══════════════════════════════════════════════════════════════
#  DIGINITY MEDIA — netlify.toml
#  Auto-detected by Netlify when you connect this GitHub repo
# ═══════════════════════════════════════════════════════════════

[build]
  publish = "."    # serve files from repo root
  command = ""     # static site — no build step needed

# ── Clean URL redirects ──────────────────────────────────────
[[redirects]]
  from = "/blog"
  to   = "/#blog"
  status = 301

[[redirects]]
  from = "/case-studies"
  to   = "/pages/case-studies.html"
  status = 301

[[redirects]]
  from = "/pricing"
  to   = "/pages/tools/pricing-calculator.html"
  status = 301

[[redirects]]
  from = "/careers"
  to   = "/pages/careers.html"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to   = "/pages/legal/privacy-policy.html"
  status = 301

[[redirects]]
  from = "/terms"
  to   = "/pages/legal/terms.html"
  status = 301

[[redirects]]
  from = "/sitemap"
  to   = "/pages/sitemap.html"
  status = 301

# ── 404 fallback ─────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/pages/404.html"
  status = 404

# ── Security Headers (applied to every page) ─────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ── Cache headers for static assets ──────────────────────────
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
